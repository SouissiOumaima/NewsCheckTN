[project]
name = "newscheck-tn"
version = "0.1.0"
description = "Détection d'affirmations vérifiables et vérification assistée (FR / AR / Tunisien)"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: tests nécessitant un modèle lourd (ignorés en CI)"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
